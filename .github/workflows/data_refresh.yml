name: Scheduled Data Refresh

on:
  schedule:
    # Run every day at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  # Allow manual trigger from GitHub Actions dashboard
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Force refetch all pages from source URLs'
        required: true
        type: boolean
        default: true
      rebuild:
        description: 'Rebuild ChromaDB collection from scratch'
        required: false
        type: boolean
        default: false

# Prevent overlapping runs
concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Ingestion & Indexing Pipeline
        run: |
          REFRESH_FLAG="--refresh"
          REBUILD_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.refresh }}" = "false" ]; then
              REFRESH_FLAG=""
            fi
            if [ "${{ github.event.inputs.rebuild }}" = "true" ]; then
              REBUILD_FLAG="--rebuild"
            fi
          fi
          python -m src.ingest.run $REFRESH_FLAG $REBUILD_FLAG

      - name: Verify Query Pipeline & RAG Integrity
        run: |
          pytest tests/ -v

      - name: Commit and Push Updated Database & Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage strictly RAG stage artifacts and ChromaDB vector files
          # (never stage secrets, .env, or query retrieval traces)
          git add data/raw data/loaded data/chunks data/embeddings data/chroma

          if git diff --staged --quiet; then
            echo "No data changes detected. ChromaDB and artifacts are already up-to-date."
          else
            echo "Changes detected. Committing refreshed RAG data and ChromaDB index..."
            git commit -m "Automated data refresh: update HDFC mutual fund data & ChromaDB index [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated ChromaDB and pushed to main."
          fi
